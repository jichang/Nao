name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency vulnerabilities and licenses
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-3.0-only, BUSL-1.1, GPL-2.0-only, GPL-3.0-only, SSPL-1.0

  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run container escape regressions
        run: bash scripts/validate-container-isolation.sh

  deployment-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Validate deployment source policy
        run: python3 scripts/validate-deployment-assets.py

      - name: Build and smoke-test worker images
        run: bash scripts/validate-worker-images.sh

      - name: Lint and render clustered deployment
        shell: bash
        run: |
          digest="sha256:$(printf '0%.0s' {1..64})"
          helm lint deploy/helm/nao \
            --set runtime.image.repository=example.invalid/nao-runtime \
            --set runtime.image.digest="$digest" \
            --set workerImages.agents.digest="$digest" \
            --set workerImages.documents.digest="$digest"
          helm template smoke deploy/helm/nao \
            --set runtime.image.repository=example.invalid/nao-runtime \
            --set runtime.image.digest="$digest" \
            --set workerImages.agents.digest="$digest" \
            --set workerImages.documents.digest="$digest" \
            > /tmp/nao-rendered.yaml
          python3 scripts/validate-deployment-assets.py --rendered /tmp/nao-rendered.yaml
          if helm template unsafe-capacity deploy/helm/nao \
            --set runtime.image.repository=example.invalid/nao-runtime \
            --set runtime.image.digest="$digest" \
            --set workerImages.agents.digest="$digest" \
            --set workerImages.documents.digest="$digest" \
            --set runtime.autoscaling.maxReplicas=11; then
            echo "unsafe autoscaling capacity unexpectedly rendered" >&2
            exit 1
          fi
          if helm template unsafe-profile deploy/helm/nao \
            --set runtime.image.repository=example.invalid/nao-runtime \
            --set runtime.image.digest="$digest" \
            --set workerImages.agents.digest="$digest" \
            --set workerImages.documents.digest="$digest" \
            --set runtime.platformConfiguration.profile=local-development; then
            echo "unsafe deployment profile unexpectedly rendered" >&2
            exit 1
          fi

  postgres-integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NAO_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=nao_test;Username=nao_test;Password=nao_test
    services:
      postgres:
        image: pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_DB: nao_test
          POSTGRES_USER: nao_test
          POSTGRES_PASSWORD: nao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nao_test -d nao_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet paket restore

      - name: Build PostgreSQL integration tests
        run: dotnet build tests/Nao.Knowledge.Postgres.Tests/Nao.Knowledge.Postgres.Tests.fsproj -c Release

      - name: Run vector lexical graph recovery and benchmark qualification
        run: >
          dotnet test tests/Nao.Knowledge.Postgres.Tests/Nao.Knowledge.Postgres.Tests.fsproj
          -c Release --no-build --filter "TestCategory=ExternalDatabase"

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet paket restore

      - name: Validate solution and test surface
        run: python3 scripts/validate-test-surface.py

      - name: Validate dependency architecture
        run: |
          python3 scripts/validate-project-dependencies.py
          python3 -m unittest scripts/test_validate_project_dependencies.py

      - name: Validate supply-chain policy
        run: |
          python3 scripts/validate-supply-chain.py
          python3 -m unittest scripts/test_validate_supply_chain.py

      - name: Validate release metadata
        run: |
          python3 scripts/release.py validate
          python3 -m unittest scripts/test_release.py

      - name: Validate integration selection and support
        run: |
          python3 scripts/validate-integrations.py
          python3 -m unittest scripts/test_validate_integrations.py

      - name: Scan NuGet dependencies for release-blocking vulnerabilities
        shell: bash
        run: |
          dotnet restore Nao.slnx
          mkdir -p artifacts/vulnerabilities
          arguments=()
          while IFS= read -r project; do
            report="artifacts/vulnerabilities/$(echo "$project" | tr '/.' '__').json"
            dotnet package list \
              --project "$project" \
              --vulnerable \
              --include-transitive \
              --format json \
              --no-restore | tee "$report"
            arguments+=(--vulnerability-report "$report")
          done < <(find src -name '*.fsproj' -o -name '*.csproj' | sort)
          python3 scripts/validate-supply-chain.py "${arguments[@]}"

      - name: Upload vulnerability reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dependency-vulnerability-reports
          path: artifacts/vulnerabilities
          if-no-files-found: error

      - name: Validate production security configuration
        run: |
          python3 scripts/validate-production-security.py
          python3 -m unittest scripts/test_validate_production_security.py

      - name: Check F# formatting
        run: dotnet fantomas --check .

      - name: Build
        run: dotnet build Nao.slnx -c Release

      - name: Run reference examples
        run: |
          dotnet run --project examples/Nao.DocumentationSnippets/Nao.DocumentationSnippets.fsproj -c Release --no-build
          dotnet run --project examples/Nao.Examples/Nao.Examples.fsproj -c Release --no-build -- all
          dotnet run --project examples/Nao.OrleansExample/Nao.OrleansExample.fsproj -c Release --no-build

      - name: Run fail-closed security regressions
        shell: bash
        run: |
          projects=(
            tests/Nao.Agents.Tests/Nao.Agents.Tests.fsproj
            tests/Nao.E2E.Tests/Nao.E2E.Tests.fsproj
            tests/Nao.Identity.Oidc.Tests/Nao.Identity.Oidc.Tests.fsproj
            tests/Nao.Persistence.Tests/Nao.Persistence.Tests.fsproj
            tests/Nao.Providers.Tests/Nao.Providers.Tests.fsproj
            tests/Nao.Runtime.Orleans.Tests/Nao.Runtime.Orleans.Tests.fsproj
          )

          for project in "${projects[@]}"; do
            dotnet test "$project" -c Release --no-build \
              --settings tests/security.runsettings \
              --filter "TestCategory=FailClosed"
          done

      - name: Run process and protocol isolation regressions
        run: >
          dotnet test tests/Nao.Agents.Tests/Nao.Agents.Tests.fsproj
          -c Release
          --no-build
          --settings tests/security.runsettings
          --filter "TestCategory=Isolation"

      - name: Run fast evaluation release gates
        id: evaluation-fast
        if: github.event_name != 'schedule'
        run: >
          dotnet test tests/Nao.Eval.Tests/Nao.Eval.Tests.fsproj
          -c Release
          --no-build
          --filter "TestCategory=EvalFast"
          --logger "trx;LogFileName=evaluation-fast.trx"
          --results-directory artifacts/evaluation/fast

      - name: Run compatibility migration and performance release gates
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          dotnet test tests/Nao.Extensions.Tests/Nao.Extensions.Tests.fsproj \
            -c Release --no-build --filter "TestCategory=Compatibility"
          dotnet test tests/Nao.Platform.Tests/Nao.Platform.Tests.fsproj \
            -c Release --no-build --filter "TestCategory=Migration"
          dotnet test tests/Nao.Knowledge.Tests/Nao.Knowledge.Tests.fsproj \
            -c Release --no-build --filter "TestCategory=Performance"

      - name: Run full scheduled evaluation release gates
        id: evaluation-full
        if: github.event_name == 'schedule'
        run: >
          dotnet test tests/Nao.Eval.Tests/Nao.Eval.Tests.fsproj
          -c Release
          --no-build
          --filter "TestCategory=EvalFull"
          --logger "trx;LogFileName=evaluation-full.trx"
          --results-directory artifacts/evaluation/full

      - name: Run scheduled restore drill
        if: github.event_name == 'schedule'
        run: >
          dotnet test tests/Nao.Platform.Tests/Nao.Platform.Tests.fsproj
          -c Release
          --no-build
          --filter "TestCategory=RestoreDrill"

      - name: Upload evaluation gate reports
        if: always() && (steps.evaluation-fast.outcome != 'skipped' || steps.evaluation-full.outcome != 'skipped')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: evaluation-gate-reports
          path: artifacts/evaluation
          if-no-files-found: error

      - name: Test with coverage
        id: coverage
        shell: bash
        run: |
          while IFS=$'\t' read -r category project; do
            project_name="$(basename "$project" .fsproj)"
            results="artifacts/test-results/$category/$project_name"
            dotnet test "$project" -c Release --no-build \
              --logger "trx;LogFileName=$project_name.trx" \
              --collect "XPlat Code Coverage" \
              --results-directory "$results"
          done < <(python3 scripts/validate-test-surface.py --list-tests)

      - name: Upload test results and coverage
        if: always() && steps.coverage.outcome != 'skipped'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-results-and-coverage
          path: artifacts/test-results
          if-no-files-found: error
