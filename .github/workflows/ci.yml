name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Run container escape regressions
        run: bash scripts/validate-container-isolation.sh

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet paket restore

      - name: Validate solution and test surface
        run: python3 scripts/validate-test-surface.py

      - name: Validate dependency architecture
        run: |
          python3 scripts/validate-project-dependencies.py
          python3 -m unittest scripts/test_validate_project_dependencies.py

      - name: Validate production security configuration
        run: |
          python3 scripts/validate-production-security.py
          python3 -m unittest scripts/test_validate_production_security.py

      - name: Check F# formatting
        run: dotnet fantomas --check .

      - name: Build
        run: dotnet build Nao.slnx -c Release

      - name: Run fail-closed security regressions
        shell: bash
        run: |
          projects=(
            tests/Nao.Agents.Tests/Nao.Agents.Tests.fsproj
            tests/Nao.E2E.Tests/Nao.E2E.Tests.fsproj
            tests/Nao.Identity.Oidc.Tests/Nao.Identity.Oidc.Tests.fsproj
            tests/Nao.Persistence.Tests/Nao.Persistence.Tests.fsproj
            tests/Nao.Providers.Tests/Nao.Providers.Tests.fsproj
            tests/Nao.Runtime.Orleans.Tests/Nao.Runtime.Orleans.Tests.fsproj
          )

          for project in "${projects[@]}"; do
            dotnet test "$project" -c Release --no-build \
              --settings tests/security.runsettings \
              --filter "TestCategory=FailClosed"
          done

      - name: Run process and protocol isolation regressions
        run: >
          dotnet test tests/Nao.Agents.Tests/Nao.Agents.Tests.fsproj
          -c Release
          --no-build
          --settings tests/security.runsettings
          --filter "TestCategory=Isolation"

      - name: Test with coverage
        shell: bash
        run: |
          while IFS=$'\t' read -r category project; do
            project_name="$(basename "$project" .fsproj)"
            results="artifacts/test-results/$category/$project_name"
            dotnet test "$project" -c Release --no-build \
              --logger "trx;LogFileName=$project_name.trx" \
              --collect "XPlat Code Coverage" \
              --results-directory "$results"
          done < <(python3 scripts/validate-test-surface.py --list-tests)

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-and-coverage
          path: artifacts/test-results
          if-no-files-found: error
