name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - README.md
      - docs/**
      - src/**
      - examples/Nao.DocumentationSnippets/**
      - Directory.Build.props
      - Nao.slnx
      - scripts/validate-docs.py
      - scripts/validate-release-docs.py
      - scripts/release.py
      - scripts/test_release.py
      - release/**
      - integration-policy.json
      - scripts/validate-integrations.py
      - scripts/test_validate_integrations.py
      - CHANGELOG.md
      - dotnet-tools.json
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet paket restore

      - name: Build
        run: dotnet build Nao.slnx -c Release

      - name: Validate documentation sources
        run: |
          python3 scripts/validate-docs.py
          python3 scripts/validate-release-docs.py
          python3 -m unittest scripts/test_validate_release_docs.py
          python3 scripts/release.py validate
          python3 -m unittest scripts/test_release.py
          python3 scripts/validate-integrations.py
          python3 -m unittest scripts/test_validate_integrations.py

      - name: Run compiled documentation snippets
        run: dotnet run --project examples/Nao.DocumentationSnippets/Nao.DocumentationSnippets.fsproj -c Release --no-build

      - name: Generate docs
        run: dotnet fsdocs build --strict --clean --output ./site --properties Configuration=Release --parameters root /Nao/

      - name: Validate generated documentation
        run: python3 scripts/validate-docs.py --site ./site --external-links

      - name: Add .nojekyll
        if: github.event_name != 'pull_request'
        run: touch ./site/.nojekyll

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./site
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
