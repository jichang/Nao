{{- if gt (int .Values.runtime.autoscaling.maxReplicas) (int .Values.capacity.providerQuotaSafeReplicas) }}
{{- fail "runtime.autoscaling.maxReplicas exceeds capacity.providerQuotaSafeReplicas" }}
{{- end }}
{{- if gt (int .Values.runtime.autoscaling.maxReplicas) (int .Values.capacity.storageSafeReplicas) }}
{{- fail "runtime.autoscaling.maxReplicas exceeds capacity.storageSafeReplicas" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nao.fullname" . }}-runtime
  labels:
    {{- include "nao.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime
spec:
  replicas: {{ .Values.runtime.replicaCount }}
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "nao.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "nao.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: runtime
    spec:
      serviceAccountName: {{ include "nao.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.runtime.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "nao.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: runtime
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "nao.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: runtime
      containers:
        - name: runtime
          image: {{ include "nao.image" (list "runtime.image" .Values.runtime.image) | quote }}
          imagePullPolicy: {{ .Values.runtime.image.pullPolicy }}
          env:
            - name: NAO_PLATFORM_CONFIGURATION
              value: /etc/nao/platform.json
            - name: NAO_WORKER_IMAGE_CONFIGURATION
              value: /etc/nao/worker-images.json
          ports:
            - name: http
              containerPort: {{ .Values.runtime.port }}
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.runtime.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: configuration
              mountPath: /etc/nao
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: configuration
          configMap:
            name: {{ include "nao.fullname" . }}-configuration
        - name: temporary
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nao.fullname" . }}-runtime
  labels:
    {{- include "nao.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "nao.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: runtime
  ports:
    - name: http
      port: 80
      targetPort: http
